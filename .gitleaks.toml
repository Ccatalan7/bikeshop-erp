title = "Vinabike ERP secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Reproducible dependency and build caches"
paths = [
  '''(^|/)\.dart_tool/''',
  '''(^|/)build/''',
  '''(^|/)node_modules/''',
  '''(^|/)Pods/''',
  '''(^|/)\.pub-cache/''',
  '''(^|/)\.gradle/''',
  '''(^|/)Flutter/ephemeral/''',
  '''^tools/invoice-parser-service/venv/''',
  '''^\.tools/''',
]

# The storefront tests send `abcdef0123456789` (and its neighbours) as the
# browser's idempotency key for `create_customer_support_request`. gitleaks
# reads it as a generic API key after `'key':`; it failed the scan on
# 5fa6ef37, ebb33a84 (fingerprints in .gitleaksignore, 2026-10-07) and again
# on be5a9b6e (2026-10-25). The synthetic value is allowed in those tests only.
[[allowlists]]
description = "Synthetic idempotency keys of the storefront tests"
condition = "AND"
paths = ['''^services/storefront_html/test/''']
regexes = ['''^abcdef012345678\d$''']

# The pgTAP tests of customer quotes build each request's idempotency key from
# the synthetic UUID family `xxxxxxxx-4d5e-4f60-8a71-<n>` (2026-11-02).
# gitleaks reads `'request_idempotency_key', '…'` as a generic API key; it
# stopped the push of 1.0.45 before main moved (2026-11-03). The family is
# allowed in the database tests only.
[[allowlists]]
description = "Synthetic idempotency keys of the pgTAP tests"
condition = "AND"
paths = ['''^supabase/tests/''']
regexes = ['''^[0-9a-f]{8}-4d5e-4f60-8a71-[0-9]*$''']

# The Deno tests of the workshop notice PDFs build the one-time document code
# from `Zq81TfY0LwmR4pXc` padded to 43 characters (2026-11-07). gitleaks reads
# `const token = "…"` as a generic API key; it stopped the push of 11f0200f
# before main moved. The synthetic value is allowed in the shared function
# tests only.
[[allowlists]]
description = "Synthetic workshop notice document codes of the Deno tests"
condition = "AND"
paths = ['''^supabase/functions/_shared/[a-z_]+_test\.ts$''']
regexes = ['''^Zq81TfY0LwmR4pXc$''']
