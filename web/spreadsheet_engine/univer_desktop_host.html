<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Vinabike Spreadsheet Engine</title>
    <link rel="stylesheet" href="univer.bundle.css" />
    <style>
      html,
      body,
      #vinabike-univer-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
    </style>
    <script>
      (() => {
        const handlerName = "vinabikeUniverEvent";
        const eventNames = [
          "vinabike-univer-ready",
          "vinabike-univer-changed",
          "vinabike-univer-error",
        ];

        function sendToFlutter(payload) {
          const bridge = window.flutter_inappwebview;
          if (!bridge || typeof bridge.callHandler !== "function") return;

          Promise.resolve(bridge.callHandler(handlerName, payload)).catch(
            () => {},
          );
        }

        for (const eventName of eventNames) {
          window.addEventListener(eventName, (event) => {
            sendToFlutter({
              type: eventName,
              ...(event.detail || {}),
            });
          });
        }

        window.addEventListener("error", (event) => {
          sendToFlutter({
            type: "vinabike-univer-host-error",
            message: event.message || "The spreadsheet host failed to load.",
          });
        });

        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          sendToFlutter({
            type: "vinabike-univer-host-error",
            message:
              reason && reason.message
                ? reason.message
                : String(reason || "Unhandled spreadsheet engine error."),
          });
        });
      })();
    </script>
    <script src="univer.bundle.js"></script>
  </head>
  <body>
    <div id="vinabike-univer-root"></div>
  </body>
</html>
