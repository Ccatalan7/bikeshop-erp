  <style>
    /* Universal fix for all browsers: prevent navigation gestures */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Disable horizontal overscroll navigation (Chrome, Edge, Safari, Firefox) */
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
      /* Legacy browser support */
      -ms-scroll-chaining: none;
      -ms-overflow-style: -ms-autohiding-scrollbar;
    }
    
    /* Apply globally to prevent any horizontal navigation */
    * {
      overscroll-behavior-x: none !important;
    }
    
    /* Disable touch gestures that trigger navigation */
    body {
      touch-action: pan-y pinch-zoom;
      -ms-touch-action: pan-y pinch-zoom;
      -ms-content-zooming: none;
    }
  </style>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <script>
    // Universal fix: Prevent horizontal wheel/trackpad gestures from triggering navigation
    // Works in Chrome, Edge, Safari, Firefox, Opera
    window.addEventListener('wheel', function(e) {
      // Only check horizontal movement
      if (Math.abs(e.deltaX) > 0) {
        // Walk up the DOM tree to check if any parent is horizontally scrollable
        let element = e.target;
        let canScrollHorizontally = false;
        
        while (element && element !== document.documentElement) {
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const overflowX = window.getComputedStyle(element).overflowX;
          
          if (hasHorizontalScrollbar && (overflowX === 'auto' || overflowX === 'scroll')) {
            canScrollHorizontally = true;
            break;
          }
          element = element.parentElement;
        }
        
        // If no horizontal scrolling is needed, prevent browser navigation
        if (!canScrollHorizontally) {
          e.preventDefault();
        }
      }
    }, { passive: false });
    
    // Prevent edge swipe gestures on touch devices
    let touchStartX = 0;
    let touchStartY = 0;
    
    window.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    
    window.addEventListener('touchmove', function(e) {
      const touchX = e.touches[0].clientX;
      const touchY = e.touches[0].clientY;
      const diffX = touchX - touchStartX;
      const diffY = touchY - touchStartY;
      
      // If swipe starts from screen edge and is primarily horizontal, block it
      const isEdgeSwipe = touchStartX < 50 || touchStartX > window.innerWidth - 50;
      const isHorizontalSwipe = Math.abs(diffX) > Math.abs(diffY);
      
      if (isEdgeSwipe && isHorizontalSwipe && Math.abs(diffX) > 30) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
