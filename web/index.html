  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overscroll-behavior-x: none; }
    body { touch-action: pan-y pinch-zoom; background: #1a1a2e; }
    
    /* Loading screen - shows while Flutter JS downloads */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    #loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    #loading-text {
      color: rgba(255,255,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin-top: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
</head>
<body>
  <!-- Loading screen shown while Flutter downloads -->
  <div id="loading-screen">
    <img id="loading-logo" src="https://xzdvtzdqjeyqxnkqprtf.supabase.co/storage/v1/object/public/vinabike-assets/company_logos/1763412155458_Logo-vinabike_ai_to_png.png" alt="Vinabike">
    <div id="loading-spinner"></div>
    <div id="loading-text">Cargando...</div>
  </div>
  <script>
    // Debug: Log URL info BEFORE Flutter loads
    console.log('📍 [index.html] window.location.href =', window.location.href);
    console.log('📍 [index.html] window.location.pathname =', window.location.pathname);
    console.log('📍 [index.html] window.location.search =', window.location.search);
    console.log('📍 [index.html] window.location.hash =', window.location.hash);
    console.log('📍 [index.html] document.baseURI =', document.baseURI);
    
    window.addEventListener('wheel', function(e) {
      if (Math.abs(e.deltaX) > 0) {
        let el = e.target, canScroll = false;
        while (el && el !== document.documentElement) {
          if (el.scrollWidth > el.clientWidth && ['auto','scroll'].includes(getComputedStyle(el).overflowX)) { canScroll = true; break; }
          el = el.parentElement;
        }
        if (!canScroll) e.preventDefault();
      }
    }, { passive: false });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
