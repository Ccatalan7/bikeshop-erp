  <!-- ERP shared-link handoff: WhatsApp opens HTTPS, this opens the desktop app. -->
  <script>
    (function () {
      try {
        var path = (window.location.pathname || '').replace(/\/+$/, '');
        if (path !== '/app/open') return;

        var params = new URLSearchParams(window.location.search || '');
        var route = params.get('route');
        if (!route) return;

        var title = params.get('title') || '';
        var appUrl = 'vinabike://app/open?route=' + encodeURIComponent(route) +
          '&title=' + encodeURIComponent(title);

        window.vinabikeAppHandoffUrl = appUrl;
        window.vinabikeAppHandoffStartedAt = Date.now();

        setTimeout(function () {
          window.location.href = appUrl;
        }, 30);
      } catch (e) {
        // Keep the Flutter fallback page available.
      }
    })();
  </script>

  <!-- Meta Pixel is initialized at runtime from the tenant website setting. -->
  <script>
    (function (window, document) {
      window.vinabikeMetaPixelInit = function (pixelId) {
        var id = String(pixelId || '').trim();
        if (!/^\d+$/.test(id)) return false;

        if (!window.fbq) {
          var fbq = window.fbq = function () {
            fbq.callMethod
              ? fbq.callMethod.apply(fbq, arguments)
              : fbq.queue.push(arguments);
          };
          if (!window._fbq) window._fbq = fbq;
          fbq.push = fbq;
          fbq.loaded = true;
          fbq.version = '2.0';
          fbq.queue = [];

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://connect.facebook.net/en_US/fbevents.js';
          var firstScript = document.getElementsByTagName('script')[0];
          firstScript.parentNode.insertBefore(script, firstScript);
        }

        if (window.__vinabikeMetaPixelId !== id) {
          window.fbq('init', id);
          window.__vinabikeMetaPixelId = id;
        }
        if (!window.__vinabikeMetaPageViewTracked) {
          window.fbq('track', 'PageView');
          window.__vinabikeMetaPageViewTracked = true;
        }
        return true;
      };

      window.vinabikeMetaPixelTrack = function (eventName, payloadJson, eventId) {
        if (!window.fbq || !window.__vinabikeMetaPixelId) return false;
        try {
          var payload = JSON.parse(payloadJson || '{}');
          if (eventId) {
            window.fbq('track', eventName, payload, { eventID: eventId });
          } else {
            window.fbq('track', eventName, payload);
          }
          return true;
        } catch (_) {
          return false;
        }
      };
    })(window, document);
  </script>

    /* Pulsing logo animation */
    #loading-logo {
      width: 200px;
      height: 200px;
      border-radius: 30px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {

      }

        transform: scale(1.05);
        opacity: 1.0;
      }

    /* Página instantánea (docs/architecture/storefront-instant-page.md): la
       ficha o la categoría que el generador de snapshots deja en
       #instant-page-template, visible desde el primer paint hasta que la
       tienda dibuja la suya. Medidas de ProductDetailPage y
       CatalogCollectionPresentationHeader; colores del tema publicado
       (--ip-*, que escribe el generador). Sin plantilla no se usa nada. */
    /* Mismo archivo que Flutter. pubspec.yaml lo declara para 400–700 sin
       variar el eje wght, así que la tienda dibuja la instancia 400 y
       engruesa las negritas: declarar sólo 400 hace que el navegador engruese
       igual. Con el rango 200–700 los títulos salían ~10 % más anchos y
       cortaban en otra línea que la ficha. */
    @font-face {
      font-family: "Oswald";
      src: url("assets/assets/fonts/Oswald-wght.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    /* Barlow, la fuente de cuerpo del registro (WebsiteFontRegistry): los
       mismos archivos y pesos que pubspec.yaml. Un texto sin familia propia
       en la tienda hereda la de cuerpo; la portada de la categoría pide 900 y,
       sin archivo 900, Flutter y el navegador usan el ExtraBold. El navegador
       sólo baja el peso que se usa, del mismo URL que la tienda. */
    @font-face {
      font-family: "Barlow";
      src: url("assets/assets/fonts/Barlow-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Barlow";
      src: url("assets/assets/fonts/Barlow-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Barlow";
      src: url("assets/assets/fonts/Barlow-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: "Barlow";
      src: url("assets/assets/fonts/Barlow-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Barlow";
      src: url("assets/assets/fonts/Barlow-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-display: swap;
    }

    /* PublicStoreHeaderGeometry: compacto 40 px de alto y 140 de ancho. */

      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      overflow: hidden;
    }

    .ip-progress::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: var(--ip-accent, #123f68);
      animation: ip-progress 1.1s ease-in-out infinite;
    }

    @keyframes ip-progress {
      to {
        left: 100%;
      }

    .ip-body {
      box-sizing: border-box;
      max-width: 1420px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .ip-product {
      display: grid;
      gap: 24px;
    }

    /* _productImageStageHeight: 88 % del ancho, entre 300 y 420 px. */
    .ip-media {
      box-sizing: border-box;
      height: clamp(300px, calc((100vw - 32px) * 0.88), 420px);
      padding: 2px;
    }

    .ip-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ip-title {
      font-family: var(--ip-heading-font, "Oswald"), "Arial Narrow", sans-serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .ip-rule {
      height: 1px;
      margin: 20px 0;
      border: 0;
      background: var(--ip-line, #e8e2d8);
    }

    .ip-price {
      color: var(--ip-accent, #123f68);

      font-size: 38px;
      font-weight: 700;

    #instant-page .ip-price-note {
      margin-top: 6px;
      color: var(--ip-secondary);
      font-size: 13px;
    }

    /* El precio del build sólo se ve después de verificarlo contra la API
       pública; pendiente, con error o distinto queda este espacio neutro
       (mismo alto que precio + nota) hasta que la tienda dibuja el vigente. */
    .ip-price,
    .ip-price-note {
      display: none;
    }

    [data-ip-state="verified"] .ip-price,
    [data-ip-state="verified"] .ip-price-note {
      display: block;
    }

    .ip-price-skeleton {
      width: 55%;
      height: 55px;
    }

    [data-ip-state="verified"] .ip-price-skeleton {
      display: none;
    }

    .ip-hero {
      position: relative;
      display: flex;
      align-items: center;
      height: var(--ip-hero-h-compact, 130px);
      overflow: hidden;
      background: linear-gradient(90deg, #0c2234, #315266);
      color: #ffffff;

    .ip-hero-image,

      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .ip-hero-image {
      object-fit: cover;
    }

    .ip-hero-text {

      box-sizing: border-box;
      width: 100%;
      max-width: 1504px;
      margin: 0 auto;
      padding: 16px 22px;
    }

    .ip-hero-text > * {
      max-width: 720px;
    }

    .ip-centered .ip-hero-text {
      text-align: center;
    }

    .ip-centered .ip-hero-text > * {
      margin-right: auto;
      margin-left: auto;
    }

    #instant-page .ip-eyebrow {
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .ip-hero-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    #instant-page .ip-hero-description {
      display: -webkit-box;
      margin-top: 16px;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .ip-grid {
      display: grid;
      box-sizing: border-box;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 16px 16px 48px;
    }

    /* Alto de migas + conteo + filtros de ProductCatalogPage en compacto:
       la grilla real empieza ~185 px bajo la portada. */
    .ip-catalog-heading {
      display: grid;
      box-sizing: border-box;
      gap: 14px;
      padding: 26px 16px 16px;
      border-bottom: 1px solid var(--ip-soft);
    }

    .ip-heading-line {
      width: 90%;
      height: 18px;
    }

    .ip-count-line {
      width: 25%;
      height: 12px;
      margin-top: 4px;
    }

    .ip-controls-line {
      width: 45%;
      height: 16px;
      margin-top: 16px;
    }

    .ip-card {
      display: grid;
      gap: 10px;
    }

    .ip-skeleton {
      border-radius: 6px;
      background: var(--ip-soft);
      animation: ip-pulse 1.4s ease-in-out infinite;
    }

    .ip-card-image {
      aspect-ratio: 1 / 1;
    }

    .ip-card-line {
      height: 12px;
    }

    .ip-short {
      width: 55%;
    }

    @keyframes ip-pulse {
      50% {
        opacity: 0.55;

    @media (max-width: 359px) {
      .ip-header {
        padding: 0 12px;
      }

      .ip-logo {
        height: 34px;
        max-width: 110px;
      }
    }

    @media (min-width: 700px) {
      .ip-title {
        font-size: 34px;
        line-height: 1.2;
      }

      .ip-hero {
        height: var(--ip-hero-h, 180px);
      }

      .ip-hero-text {
        padding: 24px 56px;

      .ip-hero-title {
        font-size: 48px;

        font-size: 16px;
        -webkit-line-clamp: 4;
      }

      /* Desde 700 px ProductCatalogPage pone los filtros en una columna
         lateral: una grilla a todo el ancho saltaría al traspaso. Bajo la

      .ip-catalog-heading,
      .ip-grid {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .ip-body {
        padding: 30px 24px 48px;
      }

      .ip-product {
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);

        height: clamp(400px, calc(50vw * 0.82), 540px);

    @media (min-width: 1080px) {
      .ip-header {
        height: 56px;
        padding: 0 24px;
      }

      .ip-logo {
        height: 38px;
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ip-progress::after {
        left: 0;
        width: 100%;
        opacity: 0.35;
        animation: none;
      }

      .ip-skeleton {
        animation: none;
      }
    }

  <!-- Pre-fetch public store data ASAP (overlaps Flutter engine startup) -->
  <script>
    (function () {
      try {
        // Prefetch only for the canonical configured host.
        var host = (window.location.host || '').toLowerCase();
        if (host.startsWith('www.')) host = host.substring(4);

        var canonicalHost = "vinabike.cl";
        if (host !== canonicalHost) return;

        var tenantId = '5443b130-cc28-45af-a420-cd500b288890';
        var edgeUrl = 'https://vinabike-edge-cache.vinabike.workers.dev/cache/public-store-data';

        // Exposed as a Promise so Flutter can await it via WebDataBridge
        window.flutter_injected_preloaded_data = (async function () {
          var controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 4500);
          try {
            var res = await fetch(edgeUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ p_tenant_id: tenantId }),
              signal: controller.signal,
              credentials: 'omit',
            });

            if (!res.ok) return null;
            var responseData = await res.json();
            if (
              !responseData ||
              typeof responseData !== 'object' ||
              Array.isArray(responseData) ||
              responseData.tenant_id !== tenantId
            ) {
              return null;
            }
            return {
              tenant_id: responseData.tenant_id,
              payload: responseData,
            };
          } catch (e) {
            return null;
          } finally {
            clearTimeout(timeout);
          }
        })();
      } catch (e) {
        // Ignore prefetch failures
      }

  <script>
    // Página instantánea (docs/architecture/storefront-instant-page.md).
    // Una ruta generada trae su ficha o categoría en #instant-page-template:
    // se muestra con el primer paint, mientras bajan el motor y el programa
    // de la tienda, y la tienda la retira con release() cuando su propia
    // página ya está dibujada. Sin plantilla (el resto de las rutas, el ERP)
    // no hace nada.
    (function () {
      var api = { active: false, release: function () {}, arm: function () {} };
      window.vinabikeInstantPage = api;
      var template = document.getElementById('instant-page-template');
      if (!template || !('content' in template)) return;

      var page = document.createElement('div');
      page.id = 'instant-page';
      page.appendChild(template.content.cloneNode(true));
      document.body.appendChild(page);
      var shell = document.getElementById('app-shell');
      if (shell) shell.classList.add('ip-covered');
      api.active = true;
      // Si el primer logo no carga, no queda una imagen rota: el encabezado
      // de la tienda prueba después el logo del tenant y el empaquetado.
      var logo = page.querySelector('.ip-logo');
      if (logo) {
        var hideLogo = function () { logo.style.visibility = 'hidden'; };
        logo.addEventListener('error', hideLogo);
        if (logo.complete && logo.naturalWidth === 0) hideLogo();
      }

      var released = false;
      var armed = false;
      api.release = function (reason) {
        if (released) return;
        released = true;
        api.active = false;
        window.vinabikeInstantPageReleased = {
          reason: String(reason || 'content'),
          at: Math.round(performance.now())
        };
        page.setAttribute('aria-hidden', 'true');
        page.classList.add('ip-leaving');
        // Retirada temprana (ficha retirada, error de arranque): vuelve el
        // splash con su logo mientras la tienda sigue cargando.
        if (shell) shell.classList.remove('ip-covered');
        setTimeout(function () {
          if (page.parentNode) page.parentNode.removeChild(page);
        }, 220);
      };
      // La tienda ya ocultó su splash. Si su página no avisa (un error, una
      // ruta que redirige a otra), la instantánea no queda encima.
      api.arm = function () {
        if (armed || released) return;
        armed = true;
        setTimeout(function () { api.release('timeout'); }, 8000);
      };

      // Frescura: el snapshot se generó en el último build. El precio nace
      // neutro (data-ip-state="pending") y sólo se muestra si una lectura
      // pública de los campos que lo deciden coincide con la firma del build.
      // Sin respuesta, con error o distinto, queda neutro hasta que la tienda
      // dibuja el vigente. Misma normalización que
      // seoInstantFreshnessSignature en el generador. El stock no se muestra:
      // lo descuentan reservas que la fila no refleja.
      var product = page.querySelector('[data-ip-sku][data-ip-sig]');
      var sku = product && product.getAttribute('data-ip-sku');
      var base = template.getAttribute('data-ip-api');
      var key = template.getAttribute('data-ip-key');
      var tenant = template.getAttribute('data-ip-tenant');
      if (!sku || !base || !key || !tenant || !window.fetch) return;
      var fields = ['website_price', 'price'];
      function norm(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'boolean') return value ? 'true' : 'false';
        if (typeof value === 'number') return value.toFixed(2);
        var text = String(value).trim();
        return /^-?\d+(\.\d+)?$/.test(text) ? Number(text).toFixed(2) : text;
      }
      fetch(base + '/rest/v1/products?select=' + fields.join(',') +
          '&tenant_id=eq.' + encodeURIComponent(tenant) +
          '&sku=eq.' + encodeURIComponent(sku) + '&limit=1', {
        headers: { apikey: key, Authorization: 'Bearer ' + key },
        credentials: 'omit'
      }).then(function (response) {
        return response.ok ? response.json() : null;
      }).then(function (rows) {
        var row = rows && rows[0];
        // La lectura anónima sólo ve fichas activas, publicadas y en la web:
        // una respuesta vacía es una ficha retirada después del build, y su
        // nombre y foto no deben seguir a la vista.
        if (Array.isArray(rows) && !row) {
          api.release('withdrawn');
          return;
        }
        if (!row) return;
        var signature = fields.map(function (field) {
          return norm(row[field]);
        }).join('|');
        if (signature === product.getAttribute('data-ip-sig')) {
          product.setAttribute('data-ip-state', 'verified');
        }
      }).catch(function () {});
    })();
  </script>
  <script>
    window.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaX) > 0) {
        let el = e.target, canScroll = false;
        while (el && el !== document.documentElement) {
          if (el.scrollWidth > el.clientWidth && ['auto', 'scroll'].includes(getComputedStyle(el).overflowX)) { canScroll = true; break; }
          el = el.parentElement;
        }
        if (!canScroll) e.preventDefault();
      }
    }, { passive: false });
  </script>
  <script>
    // Con la semántica activa (rastreadores o lector de pantalla) Flutter
    // dibuja cada destino como <a href>. Flutter ya navega dentro de la app al
    // recibir el clic (o abre la pestaña de un enlace externo); sin esto el
    // navegador además navegaría la pestaña actual. Un clic con modificador
    // (pestaña o ventana nueva) es sólo del navegador: no le llega a Flutter,
    // que si no navegaría también esta pestaña.
    document.addEventListener('click', function (event) {
      if (event.defaultPrevented || event.button !== 0) return;
      var target = event.target;
      var link = target && target.closest &&
          target.closest('flt-semantics-host a[href]');
      if (!link) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        event.stopPropagation();
        return;
      }
      event.preventDefault();
      // Flutter escucha el clic en el nodo tocable de adentro (el botón),
      // no en el <a>: si activaron el enlace mismo (Enter del teclado o un
      // lector de pantalla), el clic se le entrega a ese nodo.
      var tappable = link.querySelector('[flt-tappable]');
      if (tappable && !tappable.contains(target)) tappable.click();
    }, true);
  </script>
