  <!-- Retires Flutter's offline service worker (2026-10-07). A page the old
       worker served may get files of another build from its cache, so it
       drops the worker and its caches and loads again from the network,
       before the app starts (nothing to lose yet), once per tab.
       scripts/erp_web/flutter_service_worker.js says why. -->
  <script>
    (function () {
      try {
        var workers = navigator.serviceWorker;
        var controller = workers && workers.controller;
        var flutterWorker = '/flutter_service_worker.js';
        if (!controller || controller.scriptURL.indexOf(flutterWorker) < 0) return;
        if (sessionStorage.getItem('vb-flutter-worker-retired')) return;
        sessionStorage.setItem('vb-flutter-worker-retired', '1');
        var again = function () { window.location.reload(); };
        Promise.all([
          workers.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.filter(function (registration) {
              var worker = registration.active || registration.waiting ||
                registration.installing;
              return worker && worker.scriptURL.indexOf(flutterWorker) >= 0;
            }).map(function (registration) { return registration.unregister(); }));
          }),
          caches.keys().then(function (names) {
            return Promise.all(names.filter(function (name) {
              return name.indexOf('flutter-') === 0;
            }).map(function (name) { return caches.delete(name); }));
          })
        ]).then(again, again);
      } catch (e) {
        // Storage blocked: the worker that replaces the old one cleans up.
      }
    })();
  </script>

      // web build, Firebase's default domains, previews and localhost are
      // built from this same page; their visits are staff and agents, not
      // customers, and inflated the store's users. Elsewhere gtag() still
      // exists, so the app's events queue harmlessly and are never sent.
      var storeHost = "vinabike.cl";
      var host = (window.location.host || '').toLowerCase();
      if (host.startsWith('www.')) host = host.substring(4);
      window.vinabikeMeasurementAllowed = false;
      if (host !== storeHost) return;

      // A browser can opt out of being counted (owner, 2026-10-05): any store
      // address opened with ?sin_medir marks it, ?medir removes the mark. The
      // owner's and the agents' own visits were 43% of the store's views. The
      // mark is a cookie on the store domain, which also covers www. and a
      // future server-rendered page, plus localStorage, because Safari expires
      // cookies written by a script after seven days. It also silences the
      // Meta Pixel (vinabikeMetaPixelInit below).
      var markName = 'vb_sin_medir';
      function readMark() {
        if (('; ' + document.cookie + ';').indexOf('; ' + markName + '=1;') !== -1) {
          return true;
        }

        try {
          if (on) { window.localStorage.setItem(markName, '1'); }
          else { window.localStorage.removeItem(markName); }
        } catch (e) { /* the cookie alone still works */ }
      }

          var note = document.createElement('div');
          note.setAttribute('role', 'status');
          note.textContent = text;
          note.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +

  <!-- Meta Pixel is initialized at runtime from the tenant website setting. -->
  <script>
    (function (window, document) {
      window.vinabikeMetaPixelInit = function (pixelId) {
        // Same rule as Google Analytics: only the store's domain, never a
        // browser marked with ?sin_medir.
        if (!window.vinabikeMeasurementAllowed) return false;
        var id = String(pixelId || '').trim();
        if (!/^\d+$/.test(id)) return false;

        if (!window.fbq) {
          var fbq = window.fbq = function () {
            fbq.callMethod
              ? fbq.callMethod.apply(fbq, arguments)
              : fbq.queue.push(arguments);
          };
          if (!window._fbq) window._fbq = fbq;
          fbq.push = fbq;
          fbq.loaded = true;
          fbq.version = '2.0';
          fbq.queue = [];

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://connect.facebook.net/en_US/fbevents.js';
          var firstScript = document.getElementsByTagName('script')[0];
          firstScript.parentNode.insertBefore(script, firstScript);
        }

        if (window.__vinabikeMetaPixelId !== id) {
          window.fbq('init', id);
          window.__vinabikeMetaPixelId = id;
        }
        if (!window.__vinabikeMetaPageViewTracked) {
          window.fbq('track', 'PageView');
          window.__vinabikeMetaPageViewTracked = true;
        }
        return true;
      };

      window.vinabikeMetaPixelTrack = function (eventName, payloadJson, eventId) {
        if (!window.fbq || !window.__vinabikeMetaPixelId) return false;
        try {
          var payload = JSON.parse(payloadJson || '{}');
          if (eventId) {
            window.fbq('track', eventName, payload, { eventID: eventId });
          } else {
            window.fbq('track', eventName, payload);
          }
          return true;
        } catch (_) {
          return false;
        }
      };
    })(window, document);
  </script>

  <!-- Pre-fetch public store data ASAP (overlaps Flutter engine startup) -->
  <script>
    (function () {
      try {
        // Prefetch only for the canonical configured host.
        var host = (window.location.host || '').toLowerCase();
        if (host.startsWith('www.')) host = host.substring(4);

        var canonicalHost = "vinabike.cl";
        if (host !== canonicalHost) return;

        var tenantId = '5443b130-cc28-45af-a420-cd500b288890';
        var edgeUrl = 'https://vinabike-edge-cache.vinabike.workers.dev/cache/public-store-data';

        // Exposed as a Promise so Flutter can await it via WebDataBridge
        window.flutter_injected_preloaded_data = (async function () {
          var controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 4500);
          try {
            var res = await fetch(edgeUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ p_tenant_id: tenantId }),
              signal: controller.signal,
              credentials: 'omit',
            });

            if (!res.ok) return null;
            var responseData = await res.json();
            if (
              !responseData ||
              typeof responseData !== 'object' ||
              Array.isArray(responseData) ||
              responseData.tenant_id !== tenantId
            ) {
              return null;
            }
            return {
              tenant_id: responseData.tenant_id,
              payload: responseData,
            };
          } catch (e) {
            return null;
          } finally {
            clearTimeout(timeout);
          }
        })();
      } catch (e) {
        // Ignore prefetch failures
      }
    })();

    window.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaX) > 0) {
        let el = e.target, canScroll = false;
        while (el && el !== document.documentElement) {
          if (el.scrollWidth > el.clientWidth && ['auto', 'scroll'].includes(getComputedStyle(el).overflowX)) { canScroll = true; break; }
          el = el.parentElement;
        }
        if (!canScroll) e.preventDefault();
      }
    }, { passive: false });

  <script>
    // Con la semántica activa (rastreadores o lector de pantalla) Flutter
    // dibuja cada destino como <a href>. Flutter ya navega dentro de la app al
    // recibir el clic (o abre la pestaña de un enlace externo); sin esto el
    // navegador además navegaría la pestaña actual. Un clic con modificador
    // (pestaña o ventana nueva) es sólo del navegador: no le llega a Flutter,
    // que si no navegaría también esta pestaña.
    document.addEventListener('click', function (event) {
      if (event.defaultPrevented || event.button !== 0) return;
      var target = event.target;
      var link = target && target.closest &&
          target.closest('flt-semantics-host a[href]');
      if (!link) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        event.stopPropagation();
        return;
      }
      event.preventDefault();
      // Flutter escucha el clic en el nodo tocable de adentro (el botón),
      // no en el <a>: si activaron el enlace mismo (Enter del teclado o un
      // lector de pantalla), el clic se le entrega a ese nodo.
      var tappable = link.querySelector('[flt-tappable]');
      if (tappable && !tappable.contains(target)) tappable.click();
    }, true);
  </script>
