<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Redirigiendo...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Procesando invitación...</h2>
    <div class="spinner"></div>
    <p>Redirigiendo a la página de aceptación</p>
  </div>
  
  <script>
    // Tokens live only in the fragment so browsers never send them in
    // referrers or server request logs.
    const fragmentParams = new URLSearchParams(window.location.hash.slice(1));
    const token = fragmentParams.get('token');
    
    if (token) {
      // PathUrlStrategy uses a clean route; keep the secret in its fragment.
      window.location.replace(
        `/accept-invitation#token=${encodeURIComponent(token)}`,
      );
    } else {
      // No token, redirect to home
      window.location.replace('/');
    }
  </script>
</body>
</html>
