[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[functions.google-oauth-callback]
# Google redirects the browser back here without a Supabase Authorization header.
# POST start/status requests still revalidate website settings authority inside
# the function; only the one-time GET callback relies on its expiring state.
verify_jwt = false

[functions.ai-agent-gateway]
# The platform verifies the caller JWT first; the function then resolves the
# same caller again through fixed RLS/SECURITY DEFINER read and run-admission
# RPCs. Post-admission ledger mutations retain that caller JWT and add a
# server-only HMAC attestation bound to the exact tenant, authority fingerprint,
# run, lease, fence, operation, nonce and canonical body. PostgreSQL re-derives
# caller authority and consumes each nonce exactly once before mutation.
verify_jwt = true

[functions.google-product-diagnostics]
# Search Console and Merchant operations use server credentials, so the
# gateway and function both require an authorized ERP caller.
verify_jwt = true

[functions.admin-user-management]
# Account administration is an authenticated ERP-only surface. The function
# also revalidates tenant-scoped administrative permission before any mutation.
verify_jwt = true

[functions.send-invitation]
# Internal invitation delivery requires a valid caller JWT at the gateway and
# revalidates the caller's single active tenant plus manage-users permission.
verify_jwt = true

[functions.worker-login]
# Worker username login performs its own bounded credential exchange with the
# service role restricted to private resolution and the anon key restricted to
# the Auth password grant. It returns only the resulting refresh capability.
verify_jwt = false

[functions.gmail-oauth]
# Gmail redirects the browser back here without a Supabase Authorization header.
verify_jwt = false

[functions.zoho-oauth]
# Zoho redirects the browser back here without a Supabase Authorization header.
verify_jwt = false

[functions.push-notification]
# Database webhooks call this function without a user Supabase JWT.
verify_jwt = false

[functions.whatsapp-send]
# The send function decodes the Supabase JWT after gateway verification to avoid
# an extra Auth API round trip on every message send.
verify_jwt = true

[functions.whatsapp-deliver]
# DB-generated, hashed, single-use dispatch capability is verified by the
# service-only claim RPC. User JWTs cannot claim or finish arbitrary jobs.
verify_jwt = false

[functions.whatsapp-webhook]
# Meta cannot attach a Supabase JWT. Authenticity is enforced with the raw-body
# x-hub-signature-256 HMAC before any payload is processed.
verify_jwt = false

[functions.meta-webhook]
# Meta cannot attach a Supabase JWT. Raw-body x-hub-signature-256 is mandatory.
verify_jwt = false

[functions.meta-send]
# Staff JWT is gateway-verified and independently resolved before a durable
# service-only send receipt is created.
verify_jwt = true

[functions.meta-oauth]
# The start action authenticates staff itself; Meta's browser callback has no
# Supabase JWT and is authorized by a one-time, hashed database state.
verify_jwt = false

[functions.whatsapp-media]
# Media hydration is available only to an authenticated user who can read the
# referenced message through the canonical messaging RLS policy.
verify_jwt = true

[functions.whatsapp-catalog-sync]
# Product-form saves invoke this with the current ERP user's authenticated session.
verify_jwt = true

[functions.website-remove-background]
# Website editors invoke this with the current authenticated ERP session.
verify_jwt = true

[functions.website-optimize-image]
# Every Website Builder upload invokes the authenticated canonical optimizer.
verify_jwt = true

[functions.mercadopago-refund-payment]
# Only authenticated ERP staff can begin/retry a refund saga. The function
# independently revalidates the user and tenant-scoped correction through RLS.
verify_jwt = true

[functions.mercadopago-webhook]
# Mercado Pago cannot send a Supabase JWT. The function validates the official
# HMAC manifest before fetching any provider resource or applying an event.
verify_jwt = false

[functions.mercadopago-get-payment]
# The storefront calls this endpoint with the Supabase anon JWT and a separate
# order-scoped access token; the gateway must reject requests with no valid JWT.
verify_jwt = true

[functions.mercadopago-expire-preferences]
# pg_cron invokes this worker with a dedicated constant-time checked secret.
# It never accepts a browser JWT and all database writes use service-only RPCs.
verify_jwt = false

[functions.dispatch-storefront-publication]
# pg_cron invokes this server-owned dispatcher with a dedicated secret. Browser
# JWTs and caller-controlled tenant, target, repository, ref or URL are rejected.
verify_jwt = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# [experimental.pgdelta]
# When enabled, pg-delta becomes the active engine for supported schema flows.
# enabled = false
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
