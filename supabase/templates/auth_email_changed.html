<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Tu correo cambió</title>
  </head>
  <body style="margin:0;background:#f4f6f8;color:#1f2937;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                 style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px">
            <tr><td style="padding:28px 32px 12px;color:#1677d2;font-size:22px;font-weight:700">Viñabike</td></tr>
            <tr>
              <td style="padding:8px 32px 32px">
                <h1 style="margin:0 0 16px;font-size:24px;color:#111827">Tu correo de acceso cambió</h1>
                <p style="margin:0 0 16px;line-height:1.6">
                  El correo de tu cuenta cambió de <strong>{{ .OldEmail }}</strong> a <strong>{{ .Email }}</strong>.
                </p>
                <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5">
                  Si no realizaste este cambio, contacta de inmediato al administrador de tu cuenta.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
