<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Código de verificación</title>
  </head>
  <body style="margin:0;background:#f4f6f8;color:#1f2937;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                 style="max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px">
            <tr><td style="padding:28px 32px 12px;color:#1677d2;font-size:22px;font-weight:700">Viñabike</td></tr>
            <tr>
              <td style="padding:8px 32px 32px">
                <h1 style="margin:0 0 16px;font-size:24px;color:#111827">Verifica que eres tú</h1>
                <p style="margin:0 0 20px;line-height:1.6">Ingresa este código para continuar:</p>
                <p style="margin:0 0 24px;font-size:32px;letter-spacing:6px;font-weight:700;color:#111827">
                  {{ .Token }}
                </p>
                <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5">
                  No compartas el código. Si no iniciaste esta acción, ignora el mensaje.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
