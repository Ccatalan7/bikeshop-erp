name: vinabike_public_core
description: >-
  What a Viñabike product looks like to the public, in pure Dart: the commerce
  projection, the technical sheet, SEO copy, structured data, category paths,
  theme colors, business hours and the order summary PDF. The ERP (Flutter) and the HTML storefront
  import it, so the rules have one owner.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  intl: ^0.20.2
  pdf: ^3.11.1
  timezone: ^0.10.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
