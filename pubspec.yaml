name: vinabike_erp
description: A modular ERP system for bikeshop management built with Flutter

publish_to: 'none'

version: 1.0.3+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  
  # Navigation
  go_router: ^14.2.0
  
  # State Management
  provider: ^6.1.2
  
  # Supabase
  supabase_flutter: ^2.6.0
  
  # Deep linking for OAuth
  app_links: ^6.3.2
  
  # HTTP & Networking
  http: ^1.6.0
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.9.0
  
  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  cross_file: ^0.3.4+2
  file_picker: ^8.1.6
  image: ^4.5.0  # Image processing for optimization
  
  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2
  
  # Localization
  intl: ^0.20.2

  # Time zone conversions (for showing attendances in Chile vs local)
  timezone: ^0.10.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_colorpicker: ^1.1.0
  fl_chart: ^0.66.2
  flutter_typeahead: ^5.0.1
  flutter_svg: ^2.0.10+1
  youtube_explode_dart: ^2.0.2
  video_player: ^2.8.6
  
  # Utilities
  crypto: ^3.0.7
  uuid: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.1
  mime: ^2.0.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.3.0  # Local SQLite for email caching
  audioplayers: ^6.0.0  # For notification sounds
  csv: ^5.1.1
  excel:
    path: packages/excel_localized
  file_saver: ^0.2.8
  
  # Bluetooth & Barcode Scanning
  flutter_blue_plus: ^1.32.12
  flutter_blue_plus_windows: ^1.26.1  # NIIMBOT thermal label printer BLE driver
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  
  # OCR (Text Recognition)
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_commons: ^0.11.0
  flutter_dotenv: ^5.0.2
  
  # PDF Processing (digital PDFs only - text extraction)
  syncfusion_flutter_pdf: ^24.1.41  # Direct text extraction from digital PDFs
  firebase_messaging: ^16.1.3
  firebase_core: ^4.6.0
  flutter_local_notifications: ^19.5.0
  google_fonts: ^6.1.0
  flutter_widget_from_html: ^0.17.2
  font_awesome_flutter: ^10.7.0
  desktop_drop: ^0.7.0
  super_drag_and_drop: ^0.9.1
  flutter_markdown: ^0.7.7+1
  math_expressions: ^3.1.0
  speech_to_text: ^7.0.0

  supabase: any
dependency_overrides:
  # Security-patched Android WebView bridge. Returning false from
  # onConsoleMessage makes Chromium mirror console source URLs (including
  # possible OAuth query data) into logcat in debuggable builds.
  flutter_inappwebview_android:
    path: ./packages/flutter_inappwebview_android

  # Stub out Windows local notifications - the real plugin requires ATL headers
  # that cause build issues. Local notifications won't work on Windows.
  flutter_local_notifications_windows:
    path: ./windows_notification_stub
  
  flutter_keyboard_visibility_web:
    path: ./packages/flutter_keyboard_visibility_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/supplier_categories/
    - assets/images/campaigns/products/10ten-butyl-26-cutout.png
    - assets/images/campaigns/products/maxxis-welter-weight-29-cutout.png
    - assets/images/campaigns/products/ridexc-butyl-29-cutout.png
    - assets/icons/
    - assets/sounds/
    - assets/block_marketplace/
    - assets/manuals/
    - web/spreadsheet_engine/univer_desktop_host.html
    - web/spreadsheet_engine/univer.bundle.js
    - web/spreadsheet_engine/univer.bundle.css
    # Copias espejo de tools/chrome-extensions/aliexpress-invoice-generator/:
    # los assets del ERP viven bajo assets/ (layout convencional); la extensión
    # de Chrome sigue siendo dueña de los originales en tools/. El test
    # aliexpress_asset_mirror_test.dart exige que las copias no deriven.
    - assets/browser/aliexpress_invoice_content.js
    - assets/browser/aliexpress_invoice.css
    - assets/browser/aliexpress_invoice.js

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-wght.ttf
          weight: 400
        - asset: assets/fonts/Oswald-wght.ttf
          weight: 500
        - asset: assets/fonts/Oswald-wght.ttf
          weight: 600
        - asset: assets/fonts/Oswald-wght.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_source.png"
  ios: true
  image_path: "assets/images/app_icon_source.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: ".github/Logo VB Viñabike.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/app_icon_source.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
