name: Build Windows Desktop Release

run-name: >-
  Windows ${{ inputs.publish_release == true && 'publish' || 'artifact gate' }}
  · ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
      - "windows_notification_stub/**"
      - ".github/workflows/erp-integrity-gate.yml"
      - ".github/workflows/windows-release.yml"
      - "scripts/install_vinabike_erp.ps1"
      - "scripts/releases/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified artifact as the coworker update
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.publish_release == true && 'publish' || 'artifact' }}
  cancel-in-progress: true

jobs:
  integrity:
    uses: ./.github/workflows/erp-integrity-gate.yml

  build:
    needs: integrity
    name: Build and package Windows zip
    runs-on: windows-2022
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      zip_name: ${{ steps.meta.outputs.zip_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node for the spreadsheet engine
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Build packaged spreadsheet engine
        run: |
          npm ci
          npm run build:spreadsheet-engine

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Show Flutter toolchain
        run: flutter doctor -v

      - name: Clean generated Flutter build state
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache Firebase C++ SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\firebase_cpp_sdk_extract
          key: firebase-cpp-sdk-windows-13.5.0

      - name: Prepare Firebase C++ SDK with resumable download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkVersion = '13.5.0'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'firebase_cpp_sdk_extract'
          $sdkDir = Join-Path $extractRoot 'firebase_cpp_sdk_windows'
          $versionHeader = Join-Path $sdkDir 'include\firebase\version.h'

          if (-not (Test-Path -LiteralPath $versionHeader)) {
            $archive = Join-Path $env:RUNNER_TEMP "firebase_cpp_sdk_windows_$sdkVersion.zip"
            $url = "https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_windows_$sdkVersion.zip"
            $downloaded = $false

            for ($attempt = 1; $attempt -le 4; $attempt++) {
              Write-Host "Firebase SDK download attempt $attempt of 4"
              & curl.exe --fail --location --http1.1 `
                --retry 5 --retry-all-errors --retry-delay 5 `
                --continue-at - --output $archive $url
              if ($LASTEXITCODE -eq 0) {
                $downloaded = $true
                break
              }
              Start-Sleep -Seconds (10 * $attempt)
            }

            if (-not $downloaded) {
              throw 'Firebase C++ SDK download failed after resumable retries.'
            }

            Remove-Item -LiteralPath $extractRoot -Recurse -Force `
              -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          }

          if (-not (Test-Path -LiteralPath $versionHeader)) {
            throw "Firebase C++ SDK is incomplete: $versionHeader is missing."
          }

          "FIREBASE_CPP_SDK_DIR=$sdkDir" >> $env:GITHUB_ENV

      - name: Compute release metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $versionLine = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not read version from pubspec.yaml.'
          }

          $appVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $safeVersion = $appVersion -replace '[^0-9A-Za-z._-]', '_'
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "windows-v$safeVersion-$env:GITHUB_RUN_NUMBER"
          }
          $zipName = "vinabike_erp_windows_$safeVersion-$env:GITHUB_RUN_NUMBER.zip"

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "safe_version=$safeVersion" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release --dart-define=VINABIKE_BUILD_TAG=${{ steps.meta.outputs.release_tag }}

      # The ERP initializes its production Supabase fallback during startup.
      # A CI process-launch smoke would therefore contact production, so this
      # gate validates the complete native bundle without executing the app.
      - name: Validate Windows runtime bundle without launching it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $requiredPaths = @(
            'vinabike_erp.exe',
            'flutter_windows.dll',
            'data',
            'data\icudtl.dat',
            'data\flutter_assets',
            'data\flutter_assets\web\spreadsheet_engine\univer.bundle.js'
          )

          foreach ($relativePath in $requiredPaths) {
            $path = Join-Path $releaseDir $relativePath
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Windows runtime bundle is incomplete: $relativePath is missing."
            }
          }

      - name: Package release artifacts
        id: package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path (Get-Location) 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $zipPath = Join-Path $dist $env:ZIP_NAME

          Compress-Archive -LiteralPath $releaseDir -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" | Set-Content -LiteralPath "$zipPath.sha256" -NoNewline

          $installerName = 'install_vinabike_erp.ps1'
          $installerPath = Join-Path $dist $installerName
          Copy-Item -LiteralPath "scripts\$installerName" -Destination $installerPath -Force
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $manifest = [ordered]@{
            tag_name = $env:RELEASE_TAG
            release_name = "Vinabike ERP Windows $env:APP_VERSION"
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_number = $env:GITHUB_RUN_NUMBER
            publish_requested = ('${{ inputs.publish_release == true }}' -eq 'true')
            zip_name = $env:ZIP_NAME
            zip_sha256 = $hash
            installer_name = $installerName
            installer_sha256 = $installerHash
            built_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest |
            ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $dist 'windows-release-manifest.json') -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinabike-erp-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: build
    name: Publish verified coworker update
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write

    steps:
      - name: Check out release verification material
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node for release notes
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Download verified Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: vinabike-erp-windows
          path: dist

      - name: Generate and bind user-friendly release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_RELEASE_API_KEY: ${{ secrets.GEMINI_RELEASE_API_KEY }}
          GEMINI_RELEASE_NOTES_MODEL: ${{ vars.GEMINI_RELEASE_NOTES_MODEL || 'gemini-2.5-flash-lite' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
        run: |
          set -euo pipefail

          base_commit="$(
            bash scripts/releases/resolve_previous_release_commit.sh \
              windows-v \
              windows-release-manifest.json \
              "$GITHUB_SHA"
          )"
          node scripts/releases/generate_release_notes.mjs \
            --from-commit "$base_commit" \
            --to-commit "$GITHUB_SHA" \
            --output dist/release-notes.json

          jq -e \
            --arg base "$base_commit" \
            --arg head "$GITHUB_SHA" \
            '
              .release_notes.schema_version == 1 and
              .release_notes.locale == "es-CL" and
              .release_notes.from_commit == $base and
              .release_notes.to_commit == $head and
              (.release_notes.modules | type == "array")
            ' \
            dist/release-notes.json >/dev/null

          jq -s '.[0] * .[1]' \
            dist/windows-release-manifest.json \
            dist/release-notes.json \
            > dist/windows-release-manifest.json.tmp
          mv -f \
            dist/windows-release-manifest.json.tmp \
            dist/windows-release-manifest.json
          rm -f dist/release-notes.json

      - name: Verify packaged checksum before publication
        working-directory: dist
        run: sha256sum --check "${{ needs.build.outputs.zip_name }}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/windows-release-notes.md"
          {
            printf '## Novedades\n\n'
            jq -r '.release_notes.summary' dist/windows-release-manifest.json
            printf '\n'
            jq -r '
              .release_notes.modules[] |
              "### \(.label)\n\n" +
              (.items | map("- " + .) | join("\n")) +
              "\n"
            ' dist/windows-release-manifest.json
            cat <<EOF

          ## Instalación interna

          Vinabike ERP Windows desktop release.

          Install or update from PowerShell:

              Invoke-WebRequest https://raw.githubusercontent.com/Ccatalan7/bikeshop-erp/main/scripts/install_vinabike_erp.ps1 -OutFile \$env:TEMP\install_vinabike_erp.ps1
              powershell -ExecutionPolicy Bypass -File \$env:TEMP\install_vinabike_erp.ps1 -Launch

          The installer downloads $ZIP_NAME and verifies its SHA256 checksum before replacing the local app folder.
          Source commit: $GITHUB_SHA
          EOF
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GH_REPO" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Vinabike ERP Windows $APP_VERSION ($GITHUB_RUN_NUMBER)" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Vinabike ERP Windows $APP_VERSION ($GITHUB_RUN_NUMBER)" \
              --notes-file "$notes_file"
          fi
