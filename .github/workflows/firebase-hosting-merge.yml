# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
concurrency:
  group: production-erp-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches:
      - main
jobs:
  integrity:
    uses: ./.github/workflows/erp-integrity-gate.yml

  build_and_deploy:
    needs: integrity
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run -t lib/main.dart -o build/web_erp
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_VINABIKE }}
          channelId: live
          target: erp
          projectId: project-vinabike
