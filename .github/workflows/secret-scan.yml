name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - smartpegas1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Reject newly committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan commit range with full redaction
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same gitleaks that prepare_erp_update.sh runs before the push
          # (`gitleaks version` on the Mac). The action's default, 8.24.3,
          # ignores the `[[allowlists]]` of .gitleaks.toml: on 2026-11-03 the
          # local scan passed 1.0.45 and this one failed it for a synthetic
          # key the allowlist covers. Bump both together.
          GITLEAKS_VERSION: "8.30.1"
