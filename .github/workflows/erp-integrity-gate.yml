name: ERP Integrity Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Application regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node for packaged web assets
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Build packaged spreadsheet engine
        run: |
          npm ci
          npm run build:spreadsheet-engine

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze without increasing the existing warning baseline
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Run all Flutter tests
        run: flutter test

      - name: Compile ERP web release
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=STORE_PERF_LOGS=true
          -t lib/main.dart -o build/web_erp
