name: ERP Integrity Gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - smartpegas1.0
    paths:
      - "AGENTS.md"
      - ".github/**/*.md"
      - ".github/copilot-instructions.md"
      - ".github/GUI_DESIGN_PRINCIPLES.md"
      - ".github/GUI_MOBILE_DESIGN_PRINCIPLES.md"
      - "docs/architecture/**"
      - "docs/architecture/canonical-ui-surfaces.md"
      - "assets/**"
      - "lib/**"
      - "packages/**"
      - "test/**"
      - "web/spreadsheet_engine/**"
      - "package.json"
      - "package-lock.json"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/releases/**"
      - "scripts/run_flutter_test_gate.sh"

permissions:
  contents: read

jobs:
  verify:
    name: Application regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node for packaged web assets
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Test desktop release metadata helpers
        run: node --test scripts/releases/*.test.mjs

      - name: Build packaged spreadsheet engine
        run: |
          npm ci
          npm run build:spreadsheet-engine

      - name: Verify packaged spreadsheet assets are committed
        run: >-
          git diff --exit-code --
          web/spreadsheet_engine/univer.bundle.js
          web/spreadsheet_engine/univer.bundle.css

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify canonical UI guidance contract
        run: flutter test test/unit/ui_guidance_contract_test.dart

      - name: Analyze without increasing the existing warning baseline
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Run all Flutter tests
        run: bash scripts/run_flutter_test_gate.sh flutter

      - name: Compile ERP web release
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=STORE_PERF_LOGS=true
          -t lib/main.dart -o build/web_erp
