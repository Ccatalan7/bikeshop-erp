name: ERP Integrity Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Database and application regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Bootstrap canonical database and run all pgTAP tests
        run: bash scripts/reset_local_supabase.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze without increasing the existing warning baseline
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Run all Flutter tests
        run: flutter test

      - name: Compile ERP web release
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=STORE_PERF_LOGS=true
          -t lib/main.dart -o build/web_erp
