# Auto-deploy the public storefront when ecommerce commits land
name: Deploy Storefront to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "firebase.json"
      - "scripts/generate_product_seo_snapshots.dart"
      - "scripts/generated_product_redirects.json"
      - "scripts/check_storefront_bundle_budget.sh"
      - "scripts/sync_seo_index.sh"
      - "scripts/write_storefront_release_evidence.sh"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-store.yml"
  workflow_dispatch:

jobs:
  integrity:
    uses: ./.github/workflows/erp-integrity-gate.yml

  build_and_deploy:
    needs: integrity
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: production-store-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Sync public SEO settings before build
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bash scripts/sync_seo_index.sh

      - name: Build storefront release
        run: |
          rm -rf -- build/web_store
          flutter build web --release --pwa-strategy=none \
            --dart-define=VINABIKE_BUILD_TAG=${{ github.sha }} \
            -t lib/main_store.dart -o build/web_store
          bash scripts/check_storefront_bundle_budget.sh build/web_store

      - name: Generate SEO snapshots, sitemap, and product redirects
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://xzdvtzdqjeyqxnkqprtf.supabase.co
        run: |
          dart run scripts/generate_product_seo_snapshots.dart \
            --build-dir build/web_store \
            --tenant-id 5443b130-cc28-45af-a420-cd500b288890 \
            --store-url https://vinabike.cl \
            --product-scope published

      - name: Seal storefront release evidence
        run: |
          bash scripts/write_storefront_release_evidence.sh \
            build/web_store \
            "${{ github.sha }}" \
            "${{ github.run_id }}" \
            github-actions \
            false

      - name: Verify generated crawler assets and redirects
        run: |
          test -s build/web_store/sitemap.xml
          test -s build/web_store/robots.txt
          node -e "const f=require('./firebase.json'); const s=f.hosting.find(x=>x.target==='store'); if (!s.redirects?.length) process.exit(1)"

      - name: Retain storefront release evidence
        uses: actions/upload-artifact@v4
        with:
          name: store-release-evidence-${{ github.sha }}
          path: |
            build/web_store/release.json
            build/web_store/release.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Deploy store target
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_VINABIKE }}
          channelId: live
          target: store
          projectId: project-vinabike

      - name: Verify exact live storefront commit
        run: |
          expected_commit="${{ github.sha }}"
          for release_url in \
            "https://vinabike-store.web.app/release.json" \
            "https://vinabike.cl/release.json"; do
            verified=false
            for attempt in $(seq 1 10); do
              live_commit=$(
                curl --fail --silent --show-error \
                  -H 'Cache-Control: no-cache' \
                  "${release_url}?commit=${expected_commit}&attempt=${attempt}" \
                  | jq -r '.commit // empty'
              ) || live_commit=""

              if [ "$live_commit" = "$expected_commit" ]; then
                echo "Verified $release_url at $expected_commit"
                verified=true
                break
              fi

              echo "Waiting for $release_url (attempt $attempt/10, live=${live_commit:-unavailable})"
              sleep 3
            done

            if [ "$verified" != true ]; then
              echo "Live storefront did not converge to $expected_commit at $release_url" >&2
              exit 1
            fi
          done
